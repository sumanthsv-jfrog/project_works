# Special values for jfrog-platform chart.
# nameOverride:
# fullnameOverride:
# If this is an upgrade over an existing platform chart(>= 10.0.0), explicitly pass 'gaUpgradeReady=true' to upgrade
gaUpgradeReady: true
# If you are upgrading from a chart version(< 10.18.x) that has postgresql.image.tag of 13.x, make sure to set the current postgresql.image.tag to the same tag and databaseUpgradeReady=true.
# If you are upgrading from a chart version (>= 10.18.x), just set databaseUpgradeReady=true.
databaseUpgradeReady: false
preUpgradeHook:
  enabled: true
global:
  #imageRegistry: "<acrregistry>"
  #imagePullSecrets:
   # - jfrog-registry-secret
  jfrogUrl: "https://artifactory.20.246.203.241.nip.io"
  joinKeySecretName: artifactory-join-key
  masterKeySecretName: artifactory-master-key
 # versions:
  #  artifactory: "7.146.8"
  database:
    initDBCreation: false
  xray:
    enabled: false
  customCertificates:
    enabled: true
    certificateSecretName: artifactory-tls

postgresql:
  enabled: false

rabbitmq:
  enabled: false

artifactory:
  enabled: true
  database:
    type: postgresql
    driver: org.postgresql.Driver
    user: "artifactory"
    url: "jdbc:postgresql://sumanthart-postgres.postgres.database.azure.com:5432/artifactory?sslmode=require"
    password: "1Q2w3e4r5t6y7u"
   # secrets:
     # user:
     #   name: "artifactory-db-secret"
     #   key: "db-user"
    #  password:
     #   name: "artifactory-db-secret"
      #  key: "db-password"
     # url:
     #   name: "artifactory-db-secret"
     #   key: "db-url"

  mc:
    enabled: false

  ## Azure Workload Identity: annotate the Artifactory ServiceAccount with your UAMI client ID.
  serviceAccount:
    create: false
    name: "artifactory-sa"
    automountServiceAccountToken: true
    annotations:
      azure.workload.identity/client-id: 84a1c4cb-3bfa-43c7-a3a7-426d0a173b36
  ingress:
    enabled: true
    defaultBackend:
      enabled: true
    routerPath: /
    artifactoryPath: /artifactory/
    className: azure-application-gateway
    annotations:
      appgw.ingress.kubernetes.io/ssl-redirect: "true"
      appgw.ingress.kubernetes.io/request-timeout: "3600"
    hosts:
      - artifactory.20.246.203.241.nip.io
    tls:
      - secretName: artifactory-tls
        hosts:
          - artifactory.20.246.203.241.nip.io

  artifactory:
    labels:
      azure.workload.identity/use: "true"
    tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "artifactory"
      effect: "NoSchedule"
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: artifactory
                release: jfrog-platform
            topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-pool
              operator: In
              values: ["artifactory"]


    persistence:
      enabled: true
      size: 200Gi
      ## Azure Blob Storage V2 direct (replaces AWS S3 s3-storage-v3-direct)
      ## Ref: https://docs.jfrog.com/installation/docs/azure-blob-storage-v2-binary-provider
      type: azure-blob-storage-v2-direct
      maxCacheSize: 200000000000
      azureBlob:
        ## useInstanceCredentials: true = no accountKey, uses UAMI via Workload Identity
        ## UAMI needs Storage Blob Data Contributor on the storage account. Artifactory 7.125.4+
        ## Ref: https://docs.jfrog.com/installation/docs/azure-workload-identity
        useInstanceCredentials: true
        endpoint: "https://sumanthartifactory.blob.core.windows.net/"
        containerName: artifactory-binstore
        testConnection: false
        multiPartLimit: 25600000
        multipartElementSize: 100000000

  nginx:
    enabled: false 
    replicaCount: 2
    tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "nginx"
      effect: "NoSchedule"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-pool
              operator: In
              values:
                - nginx
    disableProxyBuffering: true

xray:
  enabled: false