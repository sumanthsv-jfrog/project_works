mutation {
  customCatalogLabel {
    removeCustomCatalogLabelFromPublicPackageVersions(
      publicPackageVersionsLabel: {
        labelName: "jfrog-waiver-policy-1116"
        publicPackageVersions: [
          {publicPackage: {name: "brace-expansion", type: "npm"}, version: "1.1.15"}
        ]
      }
    )
  }
}
